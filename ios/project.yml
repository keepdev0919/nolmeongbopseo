name: JejuFolklore
options:
  bundleIdPrefix: com.keepdev
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # 앱스토어에 보이는 버전과 업로드마다 올려야 하는 빌드 번호.
    # 1.0 (1) 을 2026-09-11 에 처음 올렸고, 같은 날 코스 탭 문구를 고쳐 1.0 (2) 를 올렸다.
    # **다시 올릴 때마다 CURRENT_PROJECT_VERSION 을
    # 하나씩 올린다** — 같은 번호는 App Store Connect 가 받지 않는다.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"

schemes:
  JejuFolklore:
    build:
      targets:
        JejuFolklore: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JejuFolkloreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: 9.0.0

targets:
  JejuFolklore:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JejuFolklore/Sources
      - path: JejuFolklore/Resources/Assets.xcassets
      - path: JejuFolklore/Resources/Fonts
      - path: JejuFolklore/Resources/Covers
      - path: JejuFolklore/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: JejuFolklore/debug-route.gpx
        optional: true
    configFiles:
      Debug: JejuFolklore/Resources/Secrets.xcconfig
      Release: JejuFolklore/Resources/Secrets.xcconfig
    dependencies:
      - package: GoogleMaps
        product: GoogleMaps
    settings:
      base:
        # 서비스 이름을 따라 바꿨다 (2026-09-11, 앱스토어 첫 업로드 전). 올린 뒤에는 못 바꾼다.
        # 이전: com.keepdev.jejufolklore — 애플 개발자 계정에 등록된 적 없음.
        PRODUCT_BUNDLE_IDENTIFIER: com.keepdev.nolmeongbopseo
        INFOPLIST_FILE: JejuFolklore/Resources/Info.plist
        # Apple Distribution 인증서의 팀 (키체인 확인 2026-09-11). 비워 두면 아카이브가
        # 서명 단계에서 멈춘다.
        DEVELOPMENT_TEAM: HB2ZHR35Y4
        CODE_SIGN_STYLE: Automatic
        # 아이폰 전용 (2026-09-11 출시 준비). 걸어 다니며 쓰는 현장 앱이고 화면이
        # 세로 전용이다. 아이패드까지 켜 두면 13인치 스크린샷과 아이패드 심사가 따라온다.
        TARGETED_DEVICE_FAMILY: "1"
        # 출시용 앱이 부를 서버 주소. 시뮬레이터·개발 기기는 Config.swift 가 따로 정한다.
        # Railway 프로젝트 nolmeongbopseo 의 무료 주소 (2026-09-11 배포, 조익준님 결정).
        # 도메인을 사면 이 줄만 바꾸면 된다.
        API_BASE_URL: https://nolmeongbopseo-production.up.railway.app
    entitlements:
      path: JejuFolklore/Resources/JejuFolklore.entitlements
    info:
      path: JejuFolklore/Resources/Info.plist
      properties:
        CFBundleDisplayName: 놀멍봅서
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 갈무리 픽셀 폰트 (SIL OFL 1.1). 등록이 빠지면 파일이 있어도 iOS가 못 찾고
        # 시스템 폰트로 조용히 폴백된다. tests/test_pixel_font_bundled.py 참조.
        UIAppFonts:
          - Galmuri9.ttf
          - Galmuri11.ttf
          - Galmuri11-Bold.ttf
          - Galmuri14.ttf
          # 시안이 쓰는 아이콘 폰트 (Material Icons, Apache-2.0)
          - MaterialIcons-Regular.ttf
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 스토어 심사 대비로 뺀 것들 (2026-09-09). 리뷰 기능은 2026-09-11에 코드째 제거했다.
        #   백그라운드 위치: 화면을 끈 채로 도착을 감지하려면 필요하지만 심사에서 사유를
        #     강하게 요구받는다. 도착 감지는 앱을 켜 둔 동안만 동작하는 것으로 충분하다.
        #   마이크·음성인식: 쓰던 리뷰 기능이 사라졌다. 쓰지 않는 권한 선언은 리젝 사유다.
        NSLocationWhenInUseUsageDescription: "현장 플레이 중 다음 지점까지 남은 거리를 보여 주기 위해 위치를 사용합니다. 위치는 기기 안에서만 확인하며 서버로 보내지 않습니다."
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationQueriesSchemes:
          - comgooglemaps
        GOOGLE_MAPS_API_KEY: $(GOOGLE_MAPS_API_KEY)
        API_BASE_URL: $(API_BASE_URL)
        # HTTPS 외에 자체 암호화를 쓰지 않는다 — 업로드마다 수출 규정 질문을 건너뛴다.
        ITSAppUsesNonExemptEncryption: false

  # 시뮬레이터에서 도는 테스트 (2026-09-29 추가). 화면 모양이 아니라 조용히 깨지면
  # 현장에서 사용자가 갇히는 진행 규칙만 본다 — 지금은 「성읍을 끝까지 풀면 CLEAR 에 닿는다」.
  JejuFolkloreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JejuFolkloreTests
        excludes:
          - Fixtures
      - path: JejuFolkloreTests/Fixtures/seongeup.json
        buildPhase: resources
    dependencies:
      - target: JejuFolklore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keepdev.nolmeongbopseo.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: HB2ZHR35Y4
        CODE_SIGN_STYLE: Automatic
